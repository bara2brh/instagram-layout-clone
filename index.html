<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <script src="index.js"></script>
        <div class="container">
    <header>
        <img class="logo" src="images/logo.png" alt="a text logo of the website called oldgram">
        <img class="avatar" src="images/user-avatar.png" alt="avatar image for the current user">
        </header>
        <main>
            <div class="post">
                <div class="post-author">
                    <img class="avatar" src="images/avatar-vangogh.jpg" alt="post author avatar">
                    <div class="author-info">
                        <h3 class="author-name">Vincent van Gogh</h3>
                        <h4 class="image-location">Zundert, Netherlands</h4>
                    </div>
                </div>
                <img class="post-image" src="images/post-vangogh.jpg" alt="a post image of painting by vincent van gogh">
                <div class="post-action" >
                    <button class="action-btn"><img class="btn-like" src="images/icon-heart.png" alt=""></button>
                    <button class="action-btn"><img class="btn-comment" src="images/icon-comment.png" alt=""></button>
                    <button class="action-btn"><img class="btn-dm" src="images/icon-dm.png" alt=""></button>
                </div>
                <h3 class="likes-counter">21 likes</h3>
                <p class="post-caption"><span class="author-username">vincey1853</span> just took a few mushrooms lol</p>   
            </div>
        </main>
        </div>
    </body>
</html>
